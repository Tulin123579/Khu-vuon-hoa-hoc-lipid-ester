<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khu Vườn Tri Thức - Hóa Học 12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF 40%, #A8E6CF 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        
        /* Staggered animation for flowers */
        .flower-item:nth-child(2n) .animate-float { animation-delay: 0.5s; }
        .flower-item:nth-child(3n) .animate-float { animation-delay: 1s; }
        .flower-item:nth-child(5n) .animate-float { animation-delay: 1.5s; }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-animate {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .flower-completed {
            filter: drop-shadow(0 0 15px rgba(253, 224, 71, 0.8));
            transform: scale(1.1);
            transition: all 0.5s ease;
        }

        .flower-unanswered {
            filter: grayscale(40%);
            transition: all 0.3s ease;
        }
        .flower-unanswered:hover {
            filter: grayscale(0%);
            transform: scale(1.05);
        }

        /* Clouds */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.8;
            animation: moveClouds linear infinite;
        }
        @keyframes moveClouds {
            from { left: -200px; }
            to { left: 100%; }
        }
    </style>
</head>
<body class="relative">

    <!-- Decorative Clouds -->
    <div class="cloud w-32 h-10 top-10" style="animation-duration: 40s;"></div>
    <div class="cloud w-48 h-14 top-24" style="animation-duration: 60s; opacity: 0.6; animation-delay: -20s;"></div>
    <div class="cloud w-24 h-8 top-16" style="animation-duration: 35s; opacity: 0.9; animation-delay: -10s;"></div>

    <div class="container mx-auto px-4 py-8 relative z-10">
        
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-extrabold text-teal-800 drop-shadow-sm mb-3">
                Khu Vườn Tri Thức Hóa Học
            </h1>
            <p class="text-lg md:text-xl text-teal-700 font-semibold mb-4">Chủ đề: Ester và Lipid</p>
            
            <div class="inline-block bg-white/80 backdrop-blur px-6 py-3 rounded-full shadow-lg border border-white">
                <span class="text-gray-700 font-bold text-lg">Tiến độ: <span id="progress-text" class="text-teal-600 text-2xl">0</span>/8 bông hoa đã nở</span>
            </div>
        </div>

        <!-- Garden Grid -->
        <div id="garden-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6 md:gap-10 max-w-4xl mx-auto pb-20">
            <!-- Flowers will be injected here via JS -->
        </div>

    </div>

    <!-- Quiz Modal (Hidden by default) -->
    <div id="quiz-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden modal-animate flex flex-col max-h-[90vh]">
            
            <!-- Modal Header -->
            <div class="bg-teal-500 p-5 text-white flex justify-between items-center relative">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <svg class="w-6 h-6 text-yellow-300" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                    Câu hỏi <span id="modal-question-id"></span>
                </h2>
                <button onclick="closeModal()" class="text-white hover:text-teal-200 transition bg-teal-600 hover:bg-teal-700 rounded-full w-8 h-8 flex items-center justify-center absolute right-4">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="p-6 md:p-8 overflow-y-auto">
                <p id="question-text" class="text-xl text-gray-800 font-bold mb-6 leading-relaxed">
                    <!-- Question text here -->
                </p>

                <!-- Options -->
                <div id="options-container" class="space-y-3 mb-6">
                    <!-- Options injected via JS -->
                </div>

                <!-- Feedback Area (Hidden initially) -->
                <div id="feedback-area" class="hidden rounded-xl p-5 border-2 transform transition-all duration-300">
                    <div class="flex items-start gap-3">
                        <div id="feedback-icon" class="mt-1 flex-shrink-0">
                            <!-- Icon injected via JS -->
                        </div>
                        <div>
                            <h3 id="feedback-title" class="font-bold text-lg mb-1"></h3>
                            <p id="feedback-text" class="text-gray-700 leading-relaxed"></p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Modal Footer (for Success action) -->
            <div id="success-footer" class="hidden bg-gray-50 p-4 border-t text-center">
                <button onclick="closeModal()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105">
                    Quay lại khu vườn
                </button>
            </div>

        </div>
    </div>

    <!-- Victory Screen (Hidden) -->
    <div id="victory-screen" class="fixed inset-0 bg-white/90 backdrop-blur-md hidden z-[60] flex flex-col items-center justify-center p-4">
        <div class="text-center modal-animate">
            <h1 class="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-blue-500 mb-6">Xuất Sắc!</h1>
            <p class="text-2xl text-gray-700 font-bold mb-8">Bạn đã làm cho tất cả các bông hoa nở rộ.</p>
            <div class="flex justify-center gap-4 text-7xl mb-8">
                🌻 🌺 🌸 🌼
            </div>
            <button onclick="resetGame()" class="bg-gradient-to-r from-teal-500 to-blue-500 hover:from-teal-600 hover:to-blue-600 text-white font-bold py-4 px-10 rounded-full shadow-2xl text-xl transition transform hover:scale-105">
                Chơi Lại Từ Đầu
            </button>
        </div>
    </div>

    <script>
        // Database from the textbook image
        const quizData = [
            {
                id: 1,
                question: "Công thức chung của ester đơn chức là gì?",
                options: ["A. R-COOH", "B. R-OH", "C. RCOOR'", "D. R-CHO"],
                correctIndex: 2, // C
                explanation: "Theo định nghĩa, khi thay thế nhóm -OH ở nhóm carboxyl (-COOH) của carboxylic acid bằng nhóm -OR' thì được ester. Công thức chung là RCOOR'."
            },
            {
                id: 2,
                question: "Ester nào sau đây có mùi hoa nhài?",
                options: ["A. Isoamyl acetate", "B. Benzyl acetate", "C. Ethyl butyrate", "D. Geranyl acetate"],
                correctIndex: 1, // B
                explanation: "Theo Hình 1.1, benzyl acetate (CH₃COOCH₂C₆H₅) là ester có mùi thơm của hoa nhài."
            },
            {
                id: 3,
                question: "Chất béo là triester của glycerol với loại acid nào?",
                options: ["A. Amino acid", "B. Acid vô cơ", "C. Acid béo", "D. Carboxylic acid mạch ngắn"],
                correctIndex: 2, // C
                explanation: "Chất béo là triester của glycerol với acid béo, gọi chung là triglyceride."
            },
            {
                id: 4,
                question: "Ở điều kiện thường, chất béo chứa chủ yếu gốc acid béo no (như mỡ bò, mỡ lợn) thường ở trạng thái nào?",
                options: ["A. Rắn", "B. Lỏng", "C. Khí", "D. Plasma"],
                correctIndex: 0, // A
                explanation: "Theo phần Tính chất vật lí, ở nhiệt độ thường, chất béo chứa nhiều gốc acid béo no sẽ ở trạng thái rắn."
            },
            {
                id: 5,
                question: "Hiện tượng dầu mỡ bị ôi thiu khi để lâu trong không khí là do phản ứng nào?",
                options: ["A. Phản ứng thuỷ phân", "B. Phản ứng cộng hydrogen", "C. Phản ứng oxi hoá bởi oxygen", "D. Phản ứng xà phòng hoá"],
                correctIndex: 2, // C
                explanation: "Khi để lâu trong không khí, các gốc acid béo không no bị oxi hoá chậm bởi oxygen, tạo thành các hợp chất có mùi khó chịu (ôi thiu)."
            },
            {
                id: 6,
                question: "Nhiệt độ sôi của ester thường như thế nào so với alcohol và carboxylic acid có cùng phân tử khối?",
                options: ["A. Cao hơn nhiều", "B. Bằng nhau", "C. Thấp hơn nhiều", "D. Gấp đôi"],
                correctIndex: 2, // C
                explanation: "Các phân tử ester không tạo được liên kết hydrogen với nhau nên nhiệt độ sôi của các ester thấp hơn nhiều so với alcohol và carboxylic acid có phân tử khối tương đương."
            },
            {
                id: 7,
                question: "Tên gọi của ester CH₃COOC₂H₅ là gì?",
                options: ["A. Methyl acetate", "B. Ethyl ethanoate (ethyl acetate)", "C. Propyl formate", "D. Ethyl propionate"],
                correctIndex: 1, // B
                explanation: "Gốc R' là C₂H₅ (ethyl), gốc acid là CH₃COO⁻ (acetate/ethanoate), nên tên gọi của ester này là ethyl acetate hoặc ethyl ethanoate."
            },
            {
                id: 8,
                question: "Quá trình chuyển hoá dầu thực vật (chất béo lỏng) thành bơ nhân tạo (chất béo rắn) sử dụng phản ứng nào?",
                options: ["A. Phản ứng thuỷ phân", "B. Phản ứng oxi hoá", "C. Phản ứng cộng hydrogen", "D. Phản ứng este hoá"],
                correctIndex: 2, // C
                explanation: "Các chất béo có gốc acid không no (dạng lỏng) có thể tham gia phản ứng cộng hydrogen tạo thành chất béo chứa gốc acid no (dạng rắn)."
            }
        ];

        // Game State
        let flowerStates = Array(8).fill(false);
        let currentActiveQuestion = null;

        // Flower SVGs (Beautiful clean designs)
        const getFlowerSVG = (isCompleted, id) => {
            // Colors vary based on ID to make garden colorful
            const hue = (id * 45) % 360; 
            const mainColor = isCompleted ? `hsl(${hue}, 80%, 60%)` : '#d1d5db';
            const centerColor = isCompleted ? '#fbbf24' : '#9ca3af';
            
            return `
                <svg viewBox="0 0 100 120" class="w-full h-full drop-shadow-md transition-all duration-300">
                    <!-- Stem -->
                    <path d="M50 70 Q 55 95 45 120" fill="none" stroke="${isCompleted ? '#4ade80' : '#9ca3af'}" stroke-width="6" stroke-linecap="round"/>
                    
                    <!-- Leaf -->
                    <path d="M50 90 Q 70 80 75 100 Q 55 100 50 90" fill="${isCompleted ? '#4ade80' : '#9ca3af'}" />
                    <path d="M48 100 Q 28 90 23 110 Q 43 110 48 100" fill="${isCompleted ? '#4ade80' : '#9ca3af'}" />

                    <!-- Petals Group -->
                    <g transform="translate(50, 45) ${isCompleted ? 'scale(1)' : 'scale(0.85)'}" class="transition-transform duration-500 origin-center">
                        <circle cx="0" cy="-20" r="15" fill="${mainColor}" opacity="0.9"/>
                        <circle cx="19" cy="-6" r="15" fill="${mainColor}" opacity="0.9"/>
                        <circle cx="12" cy="16" r="15" fill="${mainColor}" opacity="0.9"/>
                        <circle cx="-12" cy="16" r="15" fill="${mainColor}" opacity="0.9"/>
                        <circle cx="-19" cy="-6" r="15" fill="${mainColor}" opacity="0.9"/>
                        <!-- Center -->
                        <circle cx="0" cy="0" r="12" fill="${centerColor}"/>
                    </g>

                    ${isCompleted ? `
                        <!-- Checkmark overlay -->
                        <g transform="translate(35, 30)">
                            <circle cx="15" cy="15" r="14" fill="#22c55e" stroke="white" stroke-width="2"/>
                            <path d="M9 15 l4 4 l8 -8" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        </g>
                    ` : ''}
                </svg>
            `;
        };

        function renderGarden() {
            const grid = document.getElementById('garden-grid');
            grid.innerHTML = '';
            
            let completedCount = 0;

            quizData.forEach((q, index) => {
                const isCompleted = flowerStates[index];
                if (isCompleted) completedCount++;

                const flowerWrapper = document.createElement('div');
                flowerWrapper.className = `flower-item flex flex-col items-center justify-end h-40 md:h-48 relative ${isCompleted ? 'flower-completed cursor-default' : 'flower-unanswered cursor-pointer'}`;
                
                // Add click event only if not completed
                if (!isCompleted) {
                    flowerWrapper.onclick = () => openModal(index);
                }

                flowerWrapper.innerHTML = `
                    <div class="${isCompleted ? '' : 'animate-float'} w-24 h-32 md:w-32 md:h-40">
                        ${getFlowerSVG(isCompleted, q.id)}
                    </div>
                    <div class="absolute -bottom-6 bg-white/80 backdrop-blur rounded-full px-3 py-1 text-sm font-bold shadow ${isCompleted ? 'text-green-600' : 'text-gray-500'}">
                        Hoa ${q.id}
                    </div>
                `;
                
                grid.appendChild(flowerWrapper);
            });

            document.getElementById('progress-text').innerText = completedCount;

            // Check win condition
            if (completedCount === 8) {
                setTimeout(() => {
                    document.getElementById('victory-screen').classList.remove('hidden');
                }, 800);
            }
        }

        function openModal(index) {
            currentActiveQuestion = index;
            const q = quizData[index];
            
            // Populate Modal
            document.getElementById('modal-question-id').innerText = q.id;
            document.getElementById('question-text').innerText = q.question;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            // Reset feedback
            document.getElementById('feedback-area').classList.add('hidden');
            document.getElementById('success-footer').classList.add('hidden');
            
            q.options.forEach((optText, optIndex) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 border-2 border-gray-200 rounded-xl font-semibold text-gray-700 bg-white hover:bg-teal-50 hover:border-teal-400 transition-all focus:outline-none flex items-center group";
                btn.innerHTML = `
                    <div class="w-8 h-8 rounded-full border-2 border-gray-300 flex items-center justify-center mr-3 group-hover:border-teal-400 font-bold text-gray-500 group-hover:text-teal-500 flex-shrink-0">
                        ${['A','B','C','D'][optIndex]}
                    </div>
                    <span class="flex-1">${optText.substring(3)}</span>
                `;
                btn.onclick = () => checkAnswer(optIndex, btn);
                optionsContainer.appendChild(btn);
            });

            // Show Modal
            document.getElementById('quiz-modal').classList.remove('hidden');
        }

        function checkAnswer(selectedIndex, btnElement) {
            const q = quizData[currentActiveQuestion];
            const isCorrect = selectedIndex === q.correctIndex;
            const optionsContainer = document.getElementById('options-container');
            const allBtns = optionsContainer.querySelectorAll('button');
            
            const feedbackArea = document.getElementById('feedback-area');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackText = document.getElementById('feedback-text');

            if (isCorrect) {
                // Handle Correct Answer
                btnElement.className = "w-full text-left p-4 border-2 border-green-500 rounded-xl font-bold text-green-800 bg-green-100 flex items-center shadow-inner";
                btnElement.querySelector('div').className = "w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center mr-3 flex-shrink-0";
                btnElement.querySelector('div').innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>';
                
                // Disable all other buttons
                allBtns.forEach(b => {
                    if (b !== btnElement) {
                        b.disabled = true;
                        b.classList.add('opacity-50');
                        b.onclick = null;
                    }
                });

                // Show Green Feedback
                feedbackArea.className = "rounded-xl p-5 border-2 border-green-200 bg-green-50 text-green-800 animate-pulse mt-4";
                feedbackIcon.innerHTML = '<div class="bg-green-500 rounded-full p-1"><svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>';
                feedbackTitle.innerText = "Chính xác tuyệt đối!";
                feedbackText.innerText = "Bông hoa tri thức của bạn đã nở rộ. Ấn quay lại khu vườn để tiếp tục!";
                
                feedbackArea.classList.remove('hidden');
                document.getElementById('success-footer').classList.remove('hidden');
                
                // Mark as completed
                flowerStates[currentActiveQuestion] = true;

            } else {
                // Handle Wrong Answer
                // Reset other styles first (in case they clicked another wrong answer before)
                allBtns.forEach((b, i) => {
                    if (i !== q.correctIndex) { // Don't reset correct ones if somehow triggered
                        b.className = "w-full text-left p-4 border-2 border-gray-200 rounded-xl font-semibold text-gray-700 bg-white hover:bg-teal-50 hover:border-teal-400 transition-all flex items-center group cursor-pointer";
                        b.querySelector('div').className = "w-8 h-8 rounded-full border-2 border-gray-300 flex items-center justify-center mr-3 group-hover:border-teal-400 font-bold text-gray-500 group-hover:text-teal-500 flex-shrink-0";
                        b.querySelector('div').innerText = ['A','B','C','D'][i];
                    }
                });

                // Style clicked wrong answer
                btnElement.className = "w-full text-left p-4 border-2 border-red-500 rounded-xl font-bold text-red-800 bg-red-50 flex items-center shake";
                btnElement.querySelector('div').className = "w-8 h-8 rounded-full bg-red-500 text-white flex items-center justify-center mr-3 flex-shrink-0";
                btnElement.querySelector('div').innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>';

                // Show Red Feedback Box
                feedbackArea.className = "rounded-xl p-5 border-2 border-red-200 bg-red-50 text-red-800 mt-4 modal-animate";
                feedbackIcon.innerHTML = '<div class="bg-red-500 rounded-full p-1"><svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>';
                feedbackTitle.innerText = "Chưa chính xác!";
                feedbackText.innerHTML = `<strong>Giải thích:</strong> ${q.explanation}<br><br><span class="text-sm italic text-red-600">Hãy chọn lại đáp án đúng nhé!</span>`;
                
                feedbackArea.classList.remove('hidden');
            }
        }

        function closeModal() {
            document.getElementById('quiz-modal').classList.add('hidden');
            currentActiveQuestion = null;
            renderGarden(); // Re-render to show updated flower state
        }

        function resetGame() {
            flowerStates = Array(8).fill(false);
            document.getElementById('victory-screen').classList.add('hidden');
            renderGarden();
        }

        // Add shake animation to Tailwind dynamically
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        shake: 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                    },
                    keyframes: {
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        }
                    }
                }
            }
        }

        // Initialize game on load
        window.onload = () => {
            renderGarden();
        };
    </script>
</body>
</html>
